<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鐢佃剳閰嶄欢浠锋牸鐩戞帶鐪嬫澘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="data.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5;
    color: #333;
    padding: 16px;
  }
  .header {
    background: linear-gradient(135deg, #1a237e, #283593);
    color: #fff;
    padding: 20px 28px;
    border-radius: 10px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header .update-time { font-size: 14px; opacity: 0.85; }
  .header .update-time span { font-weight: 600; color: #ffd54f; }
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #fff;
    border-radius: 8px;
    padding: 14px 20px;
    flex: 1;
    min-width: 140px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: 700; }
  .stat-card .value.up { color: #e53935; }
  .stat-card .value.down { color: #43a047; }
  .stat-card .value.flat { color: #757575; }
  .module {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .module-title {
    font-size: 16px;
    font-weight: 600;
    color: #1a237e;
    margin-bottom: 14px;
    padding-left: 10px;
    border-left: 4px solid #1a237e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls select, .controls button {
    padding: 6px 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 13px;
    background: #fff;
    cursor: pointer;
  }
  .controls button.active {
    background: #1a237e;
    color: #fff;
    border-color: #1a237e;
  }
  .chart-container { width: 100%; height: 380px; }
  .chart-container.tall { height: 420px; }
  /* 娑ㄨ穼琛ㄦ牸 */
  .rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  .rank-table th {
    background: #f5f5f5;
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #ddd;
  }
  .rank-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #eee;
  }
  .rank-table tr:hover { background: #f9f9ff; }
  .change-up { color: #e53935; font-weight: 600; }
  .change-down { color: #43a047; font-weight: 600; }
  .change-flat { color: #999; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: #e8f5e9; color: #2e7d32; }
  .badge-failed { background: #ffebee; color: #c62828; }
  .badge-lowest { background: #fff3e0; color: #e65100; border: 1px solid #ffb74d; }
  .empty-tip {
    text-align: center;
    color: #999;
    padding: 40px 0;
    font-size: 14px;
  }
  /* 琛ㄦ牸妯悜婊氬姩(鎵嬫満) */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* ===== 绉诲姩绔€傞厤 ===== */
  @media (max-width: 768px) {
    body { padding: 10px; }
    .header { padding: 14px 16px; }
    .header h1 { font-size: 17px; }
    .header .update-time { font-size: 12px; }
    .stat-card { min-width: calc(50% - 6px); padding: 10px 12px; flex: 1 1 calc(50% - 6px); }
    .stat-card .value { font-size: 18px; }
    .module { padding: 14px; }
    .module-title { font-size: 14px; }
    .controls { gap: 6px; }
    .controls select, .controls button { padding: 7px 10px; font-size: 12px; }
    .chart-container { height: 300px; }
    .chart-container.tall { height: 340px; }
    .rank-table { font-size: 11px; min-width: 640px; }
    .rank-table th, .rank-table td { padding: 6px 8px; }
  }
  @media (max-width: 420px) {
    .header h1 { font-size: 15px; }
    .stat-card .label { font-size: 11px; }
    .chart-container { height: 260px; }
    .chart-container.tall { height: 300px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>鐢佃剳閰嶄欢浠锋牸鐩戞帶鐪嬫澘</h1>
  <div class="update-time">鏈€鍚庢洿鏂? <span id="lastUpdate">--</span></div>
</div>

<div class="stats-bar" id="statsBar"></div>

<!-- 妯″潡涓€: 浠婃棩娑ㄨ穼鎺掕 -->
<div class="module">
  <div class="module-title">
    <span>妯″潡涓€ 路 浠婃棩娑ㄨ穼鎺掕</span>
    <span style="font-size:12px;color:#888;font-weight:400;">瀵规瘮鏈€杩戜袱娆℃姄鍙?/span>
  </div>
  <div id="rankChart" class="chart-container"></div>
  <div id="rankTableWrap"></div>
</div>

<!-- 妯″潡浜? 浠锋牸璧板娍鏇茬嚎 -->
<div class="module">
  <div class="module-title">
    <span>妯″潡浜?路 浠锋牸璧板娍鏇茬嚎</span>
    <div class="controls">
      <select id="categorySelect"><option value="">鍏ㄩ儴鍝佺被</option></select>
      <select id="modelSelect"><option value="">璇烽€夋嫨鍨嬪彿</option></select>
      <button id="btn7d" class="active" onclick="setRange(7)">杩?澶?/button>
      <button id="btn30d" onclick="setRange(30)">杩?0澶?/button>
    </div>
  </div>
  <div id="trendChart" class="chart-container tall"></div>
</div>

<!-- 妯″潡涓? 璺ㄥ钩鍙板姣?-->
<div class="module">
  <div class="module-title">
    <span>妯″潡涓?路 璺ㄥ钩鍙颁环鏍煎姣?/span>
    <div class="controls">
      <select id="compareModelSelect"><option value="">璇烽€夋嫨鍨嬪彿</option></select>
    </div>
  </div>
  <div id="compareChart" class="chart-container"></div>
</div>

<!-- 妯″潡鍥? 鍘嗗彶鏈€浣?鏈€楂樹环 -->
<div class="module">
  <div class="module-title">
    <span>妯″潡鍥?路 鍘嗗彶鏈€浣?/ 鏈€楂樹环鍖洪棿</span>
    <div class="controls">
      <select id="rangeCategorySelect"><option value="">鍏ㄩ儴鍝佺被</option></select>
    </div>
  </div>
  <div id="rangeChart" class="chart-container tall"></div>
  <div id="rangeTableWrap"></div>
</div>

<script>
// ============================================================
// 鏁版嵁鍔犺浇涓庨澶勭悊
// ============================================================
const RAW = window.PRICE_DATA || { latest: null, history: [] };
const latest = RAW.latest || { fetch_time: "", items: [] };
const history = RAW.history || [];

// 骞冲彴閰嶈壊
const PLATFORM_COLORS = {
  "浜笢": "#e53935",
  "浠€涔堝€煎緱涔?: "#fb8c00",
  "娣樺疂": "#ff7043",
  "澶╃尗": "#f06292",
  "鎷煎澶?: "#d81b60",
};
const DEFAULT_COLORS = ["#1a237e","#00897b","#5e35b1","#00acc1","#6d4c41","#546e7a"];

function fmtTime(iso) {
  if (!iso) return "--";
  try {
    const d = new Date(iso);
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0") + " " +
      String(d.getHours()).padStart(2,"0") + ":" +
      String(d.getMinutes()).padStart(2,"0") + ":" +
      String(d.getSeconds()).padStart(2,"0");
  } catch(e) { return iso; }
}

function platformColor(p) {
  return PLATFORM_COLORS[p] || DEFAULT_COLORS[Object.keys(PLATFORM_COLORS).length % DEFAULT_COLORS.length];
}

// ============================================================
// 椤堕儴鏇存柊鏃堕棿 + 缁熻鍗＄墖
// ============================================================
document.getElementById("lastUpdate").textContent = fmtTime(latest.fetch_time);

(function renderStats() {
  const items = latest.items || [];
  const success = items.filter(i => i.status === "success").length;
  const failed = items.length - success;
  const avgPrice = items.filter(i => i.price > 0).reduce((s,i) => s + i.price, 0) / (success || 1);

  // 璁＄畻娑ㄨ穼
  let up = 0, down = 0, flat = 0;
  if (history.length >= 2) {
    const cur = history[history.length - 1].items;
    const prev = history[history.length - 2].items;
    cur.forEach(ci => {
      const pi = prev.find(p => p.id === ci.id);
      if (pi && ci.price != null && pi.price != null && pi.price > 0) {
        const diff = ci.price - pi.price;
        if (diff > 0.01) up++;
        else if (diff < -0.01) down++;
        else flat++;
      }
    });
  }

  const bar = document.getElementById("statsBar");
  bar.innerHTML = `
    <div class="stat-card"><div class="label">鐩戞帶SKU鎬绘暟</div><div class="value">${items.length}</div></div>
    <div class="stat-card"><div class="label">鎶撳彇鎴愬姛</div><div class="value" style="color:#43a047">${success}</div></div>
    <div class="stat-card"><div class="label">鎶撳彇澶辫触</div><div class="value" style="color:#e53935">${failed}</div></div>
    <div class="stat-card"><div class="label">涓婃定 / 涓嬭穼 / 鎸佸钩</div><div class="value"><span class="up">${up}鈫?/span> / <span class="down">${down}鈫?/span> / <span class="flat">${flat}-</span></div></div>
  `;
})();

// ============================================================
// 妯″潡涓€: 浠婃棩娑ㄨ穼鎺掕
// ============================================================
const rankChart = echarts.init(document.getElementById("rankChart"));

function renderRank() {
  if (history.length < 2) {
    document.getElementById("rankChart").style.display = "none";
    document.getElementById("rankTableWrap").innerHTML =
      '<div class="empty-tip">鍘嗗彶鏁版嵁涓嶈冻涓ゆ鎶撳彇锛屾棤娉曡绠楁定璺屻€傝鑷冲皯杩愯涓ゆ鎶撳彇鑴氭湰銆?/div>';
    return;
  }
  document.getElementById("rankChart").style.display = "";

  const cur = history[history.length - 1].items;
  const prev = history[history.length - 2].items;

  const rows = [];
  cur.forEach(ci => {
    const pi = prev.find(p => p.id === ci.id);
    if (!pi) return;
    if (ci.price == null || pi.price == null || pi.price <= 0) return;
    const diff = ci.price - pi.price;
    const pct = pi.price > 0 ? (diff / pi.price * 100) : 0;
    rows.push({
      id: ci.id,
      category: ci.category,
      model: ci.model,
      platform: ci.platform,
      prevPrice: pi.price,
      curPrice: ci.price,
      diff: diff,
      pct: pct,
    });
  });

  // 鎸夋定璺屽箙闄嶅簭
  rows.sort((a, b) => b.pct - a.pct);

  if (rows.length === 0) {
    document.getElementById("rankTableWrap").innerHTML =
      '<div class="empty-tip">鏃犳湁鏁堜环鏍煎姣旀暟鎹?/div>';
    return;
  }

  // 鏌辩姸鍥?  const labels = rows.map(r => r.model + "(" + r.platform + ")");
  const values = rows.map(r => +r.pct.toFixed(2));
  const colors = values.map(v => v >= 0 ? "#e53935" : "#43a047");

  rankChart.setOption({
    tooltip: {
      trigger: "axis",
      axisPointer: { type: "shadow" },
      formatter: function(params) {
        const p = params[0];
        const r = rows[p.dataIndex];
        return `<b>${r.model}</b> (${r.platform})<br/>` +
          `涓婃: 楼${r.prevPrice.toFixed(2)}<br/>` +
          `鏈: 楼${r.curPrice.toFixed(2)}<br/>` +
          `娑ㄨ穼: 楼${r.diff >= 0 ? "+" : ""}${r.diff.toFixed(2)} (${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(2)}%)`;
      }
    },
    grid: { left: 100, right: 40, top: 20, bottom: 60 },
    xAxis: {
      type: "value",
      name: "娑ㄨ穼骞?%)",
      axisLabel: { formatter: "{value}%" },
    },
    yAxis: {
      type: "category",
      data: labels,
      axisLabel: { fontSize: 11, width: 90, overflow: "truncate" },
      inverse: true,
    },
    series: [{
      type: "bar",
      data: values.map((v, i) => ({ value: v, itemStyle: { color: colors[i] } })),
      label: {
        show: true,
        position: "right",
        formatter: function(p) { return (p.value >= 0 ? "+" : "") + p.value.toFixed(1) + "%"; },
        fontSize: 11,
      },
    }],
    dataZoom: [{ type: "slider", yAxisIndex: 0, filterMode: "filter", width: 16, right: 10 }],
  });

  // 琛ㄦ牸
  let html = '<table class="rank-table"><thead><tr>' +
    "<th>鎺掑悕</th><th>鍝佺被</th><th>鍨嬪彿</th><th>骞冲彴</th>" +
    "<th>涓婃浠锋牸</th><th>鏈浠锋牸</th><th>娑ㄨ穼棰?/th><th>娑ㄨ穼骞?/th>" +
    "</tr></thead><tbody>";
  rows.forEach((r, i) => {
    const cls = r.pct > 0.01 ? "change-up" : (r.pct < -0.01 ? "change-down" : "change-flat");
    const arrow = r.pct > 0.01 ? "鈫? : (r.pct < -0.01 ? "鈫? : "-");
    html += `<tr>
      <td>${i+1}</td>
      <td>${r.category}</td>
      <td>${r.model}</td>
      <td>${r.platform}</td>
      <td>楼${r.prevPrice.toFixed(2)}</td>
      <td>楼${r.curPrice.toFixed(2)}</td>
      <td class="${cls}">${r.diff >= 0 ? "+" : ""}${r.diff.toFixed(2)}</td>
      <td class="${cls}">${arrow} ${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(2)}%</td>
    </tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("rankTableWrap").innerHTML = '<div class="table-scroll">' + html + '</div>';
}

// ============================================================
// 妯″潡浜? 浠锋牸璧板娍鏇茬嚎
// ============================================================
const trendChart = echarts.init(document.getElementById("trendChart"));
let currentRange = 7;

// 鏀堕泦鎵€鏈夊搧绫诲拰鍨嬪彿
const allCategories = [...new Set((latest.items || []).map(i => i.category))];
const allModels = [...new Set((latest.items || []).map(i => i.model))];

const catSel = document.getElementById("categorySelect");
allCategories.forEach(c => {
  const opt = document.createElement("option");
  opt.value = c; opt.textContent = c;
  catSel.appendChild(opt);
});

const modelSel = document.getElementById("modelSelect");
const cmpModelSel = document.getElementById("compareModelSelect");
allModels.forEach(m => {
  const o1 = document.createElement("option"); o1.value = m; o1.textContent = m; modelSel.appendChild(o1);
  const o2 = document.createElement("option"); o2.value = m; o2.textContent = m; cmpModelSel.appendChild(o2);
});

catSel.addEventListener("change", function() {
  const cat = this.value;
  modelSel.innerHTML = '<option value="">璇烽€夋嫨鍨嬪彿</option>';
  const models = cat
    ? [...new Set((latest.items || []).filter(i => i.category === cat).map(i => i.model))]
    : allModels;
  models.forEach(m => {
    const o = document.createElement("option"); o.value = m; o.textContent = m; modelSel.appendChild(o);
  });
  renderTrend();
});
modelSel.addEventListener("change", renderTrend);
cmpModelSel.addEventListener("change", renderCompare);

function setRange(days) {
  currentRange = days;
  document.getElementById("btn7d").classList.toggle("active", days === 7);
  document.getElementById("btn30d").classList.toggle("active", days === 30);
  renderTrend();
}

function renderTrend() {
  const model = modelSel.value;
  if (!model) {
    trendChart.clear();
    trendChart.setOption({ title: { text: "璇烽€夋嫨鍨嬪彿鏌ョ湅浠锋牸璧板娍", left: "center", top: "center", textStyle: { color: "#999", fontSize: 14 } } });
    return;
  }

  const now = new Date();
  const cutoff = new Date(now.getTime() - currentRange * 86400000);

  // 浠庡巻鍙蹭腑绛涢€夎鍨嬪彿鐨勬墍鏈夊钩鍙版暟鎹?  const platformData = {}; // platform -> [{time, price}]
  history.forEach(record => {
    const rt = new Date(record.fetch_time);
    if (rt < cutoff) return;
    (record.items || []).forEach(item => {
      if (item.model !== model) return;
      if (item.status !== "success" || item.price == null) return;
      if (!platformData[item.platform]) platformData[item.platform] = [];
      platformData[item.platform].push({ time: record.fetch_time, price: item.price });
    });
  });

  const platforms = Object.keys(platformData);
  if (platforms.length === 0) {
    trendChart.clear();
    trendChart.setOption({ title: { text: "璇ュ瀷鍙锋殏鏃犲巻鍙蹭环鏍兼暟鎹?, left: "center", top: "center", textStyle: { color: "#999", fontSize: 14 } } });
    return;
  }

  // 鎵€鏈夋椂闂寸偣
  const allTimes = new Set();
  platforms.forEach(p => platformData[p].forEach(d => allTimes.add(d.time)));
  const xTimes = [...allTimes].sort();

  const series = platforms.map(p => {
    const dataMap = {};
    platformData[p].forEach(d => { dataMap[d.time] = d.price; });
    return {
      name: p,
      type: "line",
      smooth: true,
      symbol: "circle",
      symbolSize: 6,
      lineStyle: { width: 2 },
      itemStyle: { color: platformColor(p) },
      data: xTimes.map(t => dataMap[t] != null ? dataMap[t] : null),
      connectNulls: true,
    };
  });

  trendChart.setOption({
    tooltip: {
      trigger: "axis",
      formatter: function(params) {
        let html = fmtTime(params[0].axisValue) + "<br/>";
        params.forEach(p => {
          if (p.value != null) html += `${p.marker}${p.seriesName}: 楼${p.value.toFixed(2)}<br/>`;
        });
        return html;
      }
    },
    legend: { data: platforms, top: 0 },
    grid: { left: 60, right: 30, top: 40, bottom: 50 },
    xAxis: {
      type: "category",
      data: xTimes.map(t => fmtTime(t)),
      axisLabel: { fontSize: 10, rotate: 30 },
    },
    yAxis: {
      type: "value",
      name: "浠锋牸(楼)",
      axisLabel: { formatter: "楼{value}" },
    },
    series: series,
  }, true);
}

// ============================================================
// 妯″潡涓? 璺ㄥ钩鍙板姣?// ============================================================
const compareChart = echarts.init(document.getElementById("compareChart"));

function renderCompare() {
  const model = cmpModelSel.value;
  if (!model) {
    compareChart.clear();
    compareChart.setOption({ title: { text: "璇烽€夋嫨鍨嬪彿杩涜璺ㄥ钩鍙板姣?, left: "center", top: "center", textStyle: { color: "#999", fontSize: 14 } } });
    return;
  }

  const items = (latest.items || []).filter(i => i.model === model);
  const valid = items.filter(i => i.status === "success" && i.price != null && i.price > 0);

  if (valid.length === 0) {
    compareChart.clear();
    const failedList = items.map(i => `${i.platform}(${i.status})`).join(", ");
    compareChart.setOption({ title: { text: "璇ュ瀷鍙锋殏鏃犳湁鏁堜环鏍兼暟鎹甛n" + (failedList || ""), left: "center", top: "center", textStyle: { color: "#999", fontSize: 13 } } });
    return;
  }

  const platforms = valid.map(i => i.platform);
  const prices = valid.map(i => i.price);
  const minPrice = Math.min(...prices);
  const minIdx = prices.indexOf(minPrice);

  const colors = platforms.map((p, i) => i === minIdx ? "#ff9800" : platformColor(p));

  compareChart.setOption({
    tooltip: {
      trigger: "axis",
      axisPointer: { type: "shadow" },
      formatter: function(params) {
        const p = params[0];
        const item = valid[p.dataIndex];
        return `<b>${item.model}</b><br/>` +
          `骞冲彴: ${item.platform}<br/>` +
          `浠锋牸: 楼${item.price.toFixed(2)} (${item.price_label || ""})<br/>` +
          (item.original_price ? `鍘熶环: 楼${item.original_price.toFixed(2)}<br/>` : "") +
          (p.dataIndex === minIdx ? '<span style="color:#ff9800;font-weight:600">鈽?鏈€浣庝环</span>' : "");
      }
    },
    grid: { left: 60, right: 40, top: 30, bottom: 40 },
    xAxis: {
      type: "category",
      data: platforms,
      axisLabel: { fontSize: 13, fontWeight: 600 },
    },
    yAxis: {
      type: "value",
      name: "鍒版墜浠?楼)",
      axisLabel: { formatter: "楼{value}" },
    },
    series: [{
      type: "bar",
      barWidth: "40%",
      data: prices.map((v, i) => ({
        value: v,
        itemStyle: {
          color: colors[i],
          borderRadius: i === minIdx ? [6, 6, 0, 0] : [4, 4, 0, 0],
          borderWidth: i === minIdx ? 2 : 0,
          borderColor: i === minIdx ? "#e65100" : "transparent",
        },
      })),
      label: {
        show: true,
        position: "top",
        formatter: function(p) {
          return "楼" + p.value.toFixed(2) + (p.dataIndex === minIdx ? " 鈽呮渶浣? : "");

        symbolSize: 50,

}

// ============================================================
// 妯″潡鍥? 鍘嗗彶鏈€浣?鏈€楂樹环鍖洪棿
// ============================================================
const rangeChart = echarts.init(document.getElementById("rangeChart"));

// 鍝佺被绛涢€?const rangeCatSel = document.getElementById("rangeCategorySelect");
const allRangeCategories = [...new Set((latest.items || []).map(i => i.category))];
allRangeCategories.forEach(c => {
  const opt = document.createElement("option"); opt.value = c; opt.textContent = c;
  rangeCatSel.appendChild(opt);
});
rangeCatSel.addEventListener("change", renderRange);

// 鏀堕泦鍨嬪彿鍏ㄩ儴鍘嗗彶浠锋牸鐐? 鏈湴蹇収 + SMZDM鍘嗗彶濂戒环(offers)
function collectHistoryPoints(model) {
  const seen = new Set();
  const pts = [];
  function add(price, time, src, shop) {
    if (price == null || price <= 0) return;
    const t = time || "";
    const key = price + "|" + t + "|" + src;
    if (seen.has(key)) return;
    seen.add(key);
    pts.push({ price: price, time: t, src: src, shop: shop || "" });
  }
  history.forEach(rec => {
    const rt = rec.fetch_time || "";
    (rec.items || []).forEach(it => {
      if (it.model !== model) return;
      if (it.status === "success" && it.price != null && it.price > 0) {
        add(it.price, rt, it.platform, "");
      }
      // SMZDM 鍘嗗彶濂戒环鐐?      if (it.offers && it.offers.length) {
        it.offers.forEach(o => add(o.price, o.time || rt, "SMZDM路" + (o.shop || ""), o.shop || ""));
      }
    });
  });
  return pts;
}

function renderRange() {
  const cat = rangeCatSel.value;
  const models = cat
    ? [...new Set((latest.items || []).filter(i => i.category === cat).map(i => i.model))]
    : allModels;

  const rows = [];
  models.forEach(model => {
    const pts = collectHistoryPoints(model);
    if (pts.length === 0) return;
    const prices = pts.map(p => p.price);
    const minP = Math.min(...prices), maxP = Math.max(...prices);
    const minPt = pts.find(p => p.price === minP);
    const maxPt = pts.find(p => p.price === maxP);
    // 褰撳墠浠? latest 閲岃鍨嬪彿浠讳竴鎴愬姛椤圭殑鏈€浣庝环(鍒版墜浠峰彛寰?
    const curItems = (latest.items || []).filter(i => i.model === model && i.status === "success" && i.price != null && i.price > 0);
    const curPrice = curItems.length ? Math.min(...curItems.map(i => i.price)) : null;
    rows.push({ model, category: (latest.items||[]).find(i=>i.model===model)?.category || "", pts, minP, maxP, minPt, maxPt, curPrice, ptCount: pts.length });
  });

  rows.sort((a, b) => (b.ptCount - a.ptCount) || (a.minP - b.minP));

  if (rows.length === 0) {
    rangeChart.clear();
    rangeChart.setOption({ title: { text: "鏆傛棤鍘嗗彶浠锋牸鏁版嵁锛岄殢姣忔棩鏇存柊鑷姩绉疮", left: "center", top: "center", textStyle: { color: "#999", fontSize: 14 } } });
    document.getElementById("rangeTableWrap").innerHTML = "";
    return;
  }

  const yNames = rows.map(r => r.model);
  const barData1 = rows.map(r => r.minP);        // 鍖洪棿璧风偣(閫忔槑)
  const barData2 = rows.map(r => r.maxP - r.minP); // 鍖洪棿闀垮害
  const scatterData = rows.map((r, i) => r.curPrice != null ? [r.curPrice, i] : null);

  rangeChart.setOption({
    tooltip: {
      trigger: "item",
      formatter: function(params) {
        const i = params.dataIndex;
        const r = rows[i];
        if (!r) return "";
        if (params.seriesType === "scatter") {
          return `<b>${r.model}</b><br/>褰撳墠浠? 楼${r.curPrice.toFixed(2)}`;
        }
        return `<b>${r.model}</b> (${r.category})<br/>` +
          `鍘嗗彶鏈€浣? 楼${r.minP.toFixed(2)} (${r.minPt.time || "--"} / ${r.minPt.src})<br/>` +
          `鍘嗗彶鏈€楂? 楼${r.maxP.toFixed(2)} (${r.maxPt.time || "--"} / ${r.maxPt.src})<br/>` +
          `鍘嗗彶鐐规暟: ${r.ptCount}`;
      }
    },
    grid: { left: 170, right: 70, top: 10, bottom: 60 },
    xAxis: {
      type: "value",
      name: "浠锋牸(楼)",
      axisLabel: { formatter: "楼{value}" },
    },
    yAxis: {
      type: "category",
      data: yNames,
      axisLabel: { fontSize: 11, width: 160, overflow: "truncate" },
      inverse: true,
    },
    series: [
      {
        name: "鍖洪棿璧风偣",
        type: "bar",
        stack: "range",
        barWidth: 14,
        itemStyle: { color: "rgba(0,0,0,0)" },
        data: barData1,
        emphasis: { disabled: true },
      },
      {
        name: "浠锋牸鍖洪棿",
        type: "bar",
        stack: "range",
        barWidth: 14,
        itemStyle: { color: "#9fa8da", borderRadius: [3, 3, 3, 3] },
        data: barData2,
      },
      {
        name: "褰撳墠浠?,
        type: "scatter",
        symbol: "circle",
        symbolSize: 9,
        itemStyle: { color: "#e65100", borderColor: "#fff", borderWidth: 1.5 },
        data: scatterData,
        tooltip: { trigger: "item" },
      },
    ],
    dataZoom: [{ type: "slider", yAxisIndex: 0, width: 16, right: 10 }],
  }, true);

  // 鏄庣粏琛?  let html = '<table class="rank-table"><thead><tr>' +
    "<th>鍨嬪彿</th><th>鍝佺被</th><th>褰撳墠浠?/th>" +
    "<th>鍘嗗彶鏈€浣?/th><th>鏈€浣庢椂闂?/th><th>鏈€浣庢潵婧?/th>" +
    "<th>鍘嗗彶鏈€楂?/th><th>鏈€楂樻椂闂?/th><th>鏈€楂樻潵婧?/th>" +
    "<th>璺濇渶浣庢孩浠?/th><th>鍘嗗彶鐐规暟</th>" +
    "</tr></thead><tbody>";
  rows.forEach(r => {
    const premium = r.curPrice != null ? (r.curPrice - r.minP) / r.minP * 100 : null;
    const premCls = premium != null && premium > 3 ? "change-up" : (premium != null && premium < -1 ? "change-down" : "change-flat");
    const premTxt = premium != null ? (premium >= 0 ? "+" : "") + premium.toFixed(1) + "%" : "--";
    html += `<tr>
      <td><b>${r.model}</b></td>
      <td>${r.category}</td>
      <td>${r.curPrice != null ? "楼" + r.curPrice.toFixed(2) : "--"}</td>
      <td class="badge-lowest" style="padding:2px 6px;">楼${r.minP.toFixed(2)}</td>
      <td>${r.minPt.time || "--"}</td>
      <td>${r.minPt.src}</td>
      <td style="color:#e53935;font-weight:600;">楼${r.maxP.toFixed(2)}</td>
      <td>${r.maxPt.time || "--"}</td>
      <td>${r.maxPt.src}</td>
      <td class="${premCls}">${premTxt}</td>
      <td>${r.ptCount}</td>
    </tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("rangeTableWrap").innerHTML = '<div class="table-scroll">' + html + '</div>';
}
